<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strength Program</title>
<link rel="icon" href="./public/Just R Black Background.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --glass-bg: rgba(255,255,255,0.52);
  --glass-bg-strong: rgba(255,255,255,0.72);
  --glass-bg-subtle: rgba(255,255,255,0.32);
  --glass-border: rgba(255,255,255,0.75);
  --glass-border-subtle: rgba(255,255,255,0.45);
  --glass-blur: blur(28px) saturate(180%);
  --glass-blur-sm: blur(16px) saturate(160%);
  --glass-shadow: 0 8px 32px rgba(80,120,200,0.10), 0 2px 8px rgba(80,120,200,0.07);
  --glass-shadow-lg: 0 16px 48px rgba(80,120,200,0.14), 0 4px 16px rgba(80,120,200,0.09);
  --inset-top: inset 0 1px 0 rgba(255,255,255,0.85);
  --inset-bot: inset 0 -1px 0 rgba(160,180,220,0.18);
  --text: #1a1a2e;
  --text-sec: rgba(30,35,70,0.58);
  --text-ter: rgba(30,35,70,0.38);
  --accent: #3b82f6;
}

html, body {
  width: 100%; min-height: 100%;
  font-family: 'Outfit', sans-serif;
  background: #f0f6ff;
  color: var(--text);
  overflow-x: hidden;
}

.mesh-bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 20%, #dbeafe 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 10%, #e0f2fe 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 90%, #f0fdf4 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 80% 70%, #fce7f3 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 20% 80%, #fefce8 0%, transparent 50%),
    #eef4ff;
  animation: meshF 20s ease-in-out infinite alternate;
}
@keyframes meshF {
  0%   { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(12deg); }
}
.mesh-bg::after {
  content:''; position:absolute; inset:0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
}

.glass {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), var(--inset-top), var(--inset-bot);
}
.glass-strong {
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow-lg), var(--inset-top), var(--inset-bot);
}

/* NAV */
.nav-island {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; align-items: center; gap: 4px;
  padding: 6px 8px; border-radius: 999px;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 4px 24px rgba(80,120,200,0.14), 0 1px 4px rgba(80,120,200,0.08),
              inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(160,180,220,0.2);
  white-space: nowrap;
}
.nav-logo {
  font-family: 'DM Serif Display', serif; font-style: italic;
  font-size: 15px; color: var(--text); padding: 4px 10px;
  opacity: 0.75; letter-spacing: 0.01em;
}
.nav-sep { width:1px; height:18px; background: linear-gradient(180deg,transparent,rgba(100,120,200,0.2),transparent); flex-shrink:0; margin:0 2px; }

/* swim toggle button in nav */
.swim-toggle {
  font-size: 13px; font-weight: 500; padding: 7px 16px;
  border-radius: 999px; border: none; background: transparent;
  color: var(--text-sec); cursor: pointer; font-family: 'Outfit', sans-serif;
  transition: all 0.18s ease; letter-spacing: 0.01em;
  display: flex; align-items: center; gap: 6px;
}
.swim-toggle:hover { background: rgba(59,130,246,0.08); color: #1d4ed8; }
.swim-toggle.on {
  background: rgba(59,130,246,0.12); color: #1d4ed8;
  box-shadow: inset 0 1px 0 rgba(255,255,255,1);
}
.swim-toggle .swim-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; opacity: 0.5; transition: opacity 0.18s;
}
.swim-toggle.on .swim-dot { opacity: 1; }

/* WEEK STRIP */
.week-strip {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: none; align-items: center; gap: 3px;
  padding: 7px 10px; border-radius: 999px;
  background: rgba(255,255,255,0.68);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.88);
  box-shadow: 0 8px 32px rgba(80,120,200,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
  overflow-x: auto; max-width: calc(100vw - 32px); scrollbar-width: none;
}
.week-strip::-webkit-scrollbar { display:none; }
.week-strip.visible { display: flex; }

.wk-plabel {
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-ter);
  padding: 0 5px; flex-shrink: 0;
}
/* Phase label color hints */
.wk-plabel.ph0 { color: #7c3aed; }
.wk-plabel.ph1 { color: #0e7490; }
.wk-plabel.ph2 { color: #065f46; }
.wk-plabel.ph3 { color: #991b1b; }

.wk-sep { width:1px; height:14px; background: rgba(100,120,200,0.15); flex-shrink:0; margin:0 3px; }

.wk-btn {
  font-size: 11.5px; font-weight: 500; padding: 5px 11px;
  border-radius: 999px; border: none; background: transparent;
  color: var(--text-sec); cursor: pointer; flex-shrink: 0;
  transition: all 0.18s ease; font-family: 'Outfit', sans-serif; white-space: nowrap;
}
.wk-btn:hover { background: rgba(59,130,246,0.07); color: #1d4ed8; }
.wk-btn.active { background: white; color: var(--text); box-shadow: 0 2px 8px rgba(80,120,200,0.15), inset 0 1px 0 rgba(255,255,255,1); }

/* per-phase button colors when active */
.wk-btn.ph0 { color: rgba(109,40,217,0.7); }
.wk-btn.ph0.active { color: #5b21b6; background: #ede9fe; box-shadow: 0 2px 8px rgba(109,40,217,0.15); }
.wk-btn.ph1 { color: rgba(14,116,144,0.75); }
.wk-btn.ph1.active { color: #0e7490; background: #cffafe; box-shadow: 0 2px 8px rgba(14,116,144,0.15); }
.wk-btn.ph2 { color: rgba(6,95,70,0.75); }
.wk-btn.ph2.active { color: #065f46; background: #d1fae5; box-shadow: 0 2px 8px rgba(6,95,70,0.15); }
.wk-btn.ph3 { color: rgba(153,27,27,0.75); }
.wk-btn.ph3.active { color: #991b1b; background: #fee2e2; box-shadow: 0 2px 8px rgba(220,38,38,0.15); }
.wk-btn.deload { opacity: 0.65; font-style: italic; }
.wk-btn.attempt { font-weight: 700; }

/* MAIN */
main { position: relative; z-index: 10; padding: 100px 24px 100px; max-width: 1280px; margin: 0 auto; }

/* WEEK HEADER */
.wk-header {
  border-radius: 22px; padding: 22px 26px;
  margin-bottom: 14px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 14px;
}
.wk-title { font-family:'DM Serif Display',serif; font-size:38px; line-height:1; }
.wk-dates { font-size:12.5px; color:var(--text-ter); margin-top:4px; }
.wk-badge {
  font-size:12px; font-weight:600; padding:7px 20px; border-radius:999px;
  letter-spacing:0.03em; backdrop-filter:blur(12px);
}
.wb-hyp    { background:rgba(109,40,217,0.10); color:#5b21b6; border:1px solid rgba(109,40,217,0.22); }
.wb-normal { background:rgba(6,182,212,0.10); color:#0e7490; border:1px solid rgba(6,182,212,0.22); }
.wb-str2   { background:rgba(16,185,129,0.10); color:#065f46; border:1px solid rgba(16,185,129,0.20); }
.wb-deload { background:rgba(245,158,11,0.12); color:#92400e; border:1px solid rgba(245,158,11,0.25); }
.wb-peak   { background:rgba(239,68,68,0.10); color:#991b1b; border:1px solid rgba(239,68,68,0.22); }
.wb-attempt { background:rgba(239,68,68,0.12); color:#991b1b; border:1px solid rgba(239,68,68,0.3);
              animation: apulse 2s ease-in-out infinite; }
@keyframes apulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0);} 50%{box-shadow:0 0 0 5px rgba(239,68,68,0.08);} }

/* phase note bar */
.ph-note {
  font-size: 13px; color: var(--text-sec); margin-bottom: 14px;
  padding: 10px 18px; border-radius: 12px;
  background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.7);
  display: none;
}
.ph-note.visible { display: block; }

.wk-note {
  font-size: 13px; font-style: italic; color: var(--text-sec); margin-bottom: 14px;
  padding: 10px 18px; border-radius: 12px;
  background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.15);
  display: none;
}
.wk-note.visible { display: block; }

.attempt-banner {
  border-radius:14px; padding:13px 18px; margin-bottom:14px;
  font-size:13px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase;
  text-align:center; background:rgba(239,68,68,0.07); border:1px solid rgba(239,68,68,0.2);
  color:#991b1b; display:none; align-items:center; justify-content:center; gap:12px;
}

.prog-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
.pc { border-radius:18px; padding:18px 18px 15px; position:relative; overflow:hidden; }
.pc::before { content:''; position:absolute; top:0;left:0;right:0;height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),transparent); }
.pc-label { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-ter); margin-bottom:8px; }
.pc-val { font-family:'DM Serif Display',serif; font-size:26px; line-height:1; color:var(--accent); margin-bottom:3px; }
.pc-sr { font-size:11px; color:var(--text-ter); }

.day-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
.day-card {
  border-radius:22px; overflow:hidden; position:relative;
  transition:transform 0.2s, box-shadow 0.2s;
}
.day-card:hover { transform:translateY(-3px); box-shadow:var(--glass-shadow-lg), var(--inset-top); }
.day-card::before { content:''; position:absolute; top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.95),transparent); z-index:1; }
.day-card.swim-card { transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s, max-height 0.3s; }
.day-card.swim-hidden { display: none; }

.dc-header {
  padding:17px 20px 14px; display:flex; align-items:flex-start;
  justify-content:space-between; border-bottom:1px solid rgba(100,120,200,0.08); gap:12px;
}
.dc-name { font-family:'DM Serif Display',serif; font-size:22px; line-height:1; }
.dc-date { font-size:11px; color:var(--text-ter); margin-top:4px; }
.dc-type {
  font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  padding:5px 14px; border-radius:999px; flex-shrink:0; margin-top:2px;
}
.dct-push   { background:rgba(245,158,11,0.11); color:#92400e; border:1px solid rgba(245,158,11,0.24); }
.dct-pull   { background:rgba(6,182,212,0.1); color:#0e7490; border:1px solid rgba(6,182,212,0.2); }
.dct-lower  { background:rgba(16,185,129,0.1); color:#065f46; border:1px solid rgba(16,185,129,0.2); }
.dct-swim   { background:rgba(59,130,246,0.1); color:#1d4ed8; border:1px solid rgba(59,130,246,0.2); }

.ex-list { padding:6px 0; }
.ex-row {
  display:flex; align-items:center; padding:9px 20px; gap:10px;
  transition:background 0.14s;
}
.ex-row:hover { background:rgba(59,130,246,0.04); }
.ex-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; background:rgba(100,130,200,0.2); }
.ex-dot.p { background:var(--accent); width:7px; height:7px; box-shadow:0 0 6px rgba(59,130,246,0.35); }
.ex-left { flex:1; min-width:0; }
.ex-name { font-size:13.5px; font-weight:400; color:var(--text); line-height:1.3; }
.ex-name.p { font-size:14px; font-weight:600; }
.ex-sets { font-size:11px; color:var(--text-ter); margin-top:1px; }
.ex-right { text-align:right; flex-shrink:0; }
.ex-w { font-family:'DM Serif Display',serif; font-size:17px; color:var(--accent); line-height:1; display:block; }
.ex-w.p { font-size:20px; }
.ex-rest { font-size:10.5px; color:var(--text-ter); display:block; margin-top:2px; }

@media(max-width:700px){
  main{padding:86px 12px 100px;}
  .prog-strip{grid-template-columns:repeat(2,1fr);}
  .day-grid{grid-template-columns:1fr;}
  .nav-island { gap: 2px; }
}
</style>
</head>
<body>

<nav class="nav-island">

<!-- WEEK STRIP — all 33 weeks, grouped by correct phase -->
<div class="week-strip visible" id="weekStrip">

  <span class="wk-plabel ph0">Ph0</span>
  <button class="wk-btn ph0" data-wk="1">Wk 1</button>
  <button class="wk-btn ph0" data-wk="2">Wk 2</button>
  <button class="wk-btn ph0" data-wk="3">Wk 3</button>
  <button class="wk-btn ph0 deload" data-wk="4">Wk 4</button>

  <!-- Phase 1: Strength (wks 10–16) -->
  <span class="wk-plabel ph1">Ph1</span>

  <!-- Phase 2: Strength+ (wks 17–24) -->
  <span class="wk-plabel ph2">Ph2</span>
  <button class="wk-btn ph2" data-wk="17">Wk 17</button>
  <button class="wk-btn ph2" data-wk="18">Wk 18</button>
  <button class="wk-btn ph2" data-wk="19">Wk 19</button>
  <button class="wk-btn ph2 deload" data-wk="20">Wk 20</button>
  <button class="wk-btn ph2" data-wk="21">Wk 21</button>
  <button class="wk-btn ph2" data-wk="22">Wk 22</button>
  <button class="wk-btn ph2" data-wk="23">Wk 23</button>
  <button class="wk-btn ph2 deload" data-wk="24">Wk 24</button>
  <div class="wk-sep"></div>

  <!-- Phase 3: Peaking (wks 25–33) -->
  <span class="wk-plabel ph3">Ph3</span>
  <button class="wk-btn ph3" data-wk="25">Wk 25</button>
  <button class="wk-btn ph3" data-wk="26">Wk 26</button>
  <button class="wk-btn ph3" data-wk="27">Wk 27</button>
  <button class="wk-btn ph3 deload" data-wk="28">Wk 28</button>
  <button class="wk-btn ph3" data-wk="29">Wk 29</button>
  <button class="wk-btn ph3" data-wk="30">Wk 30</button>
  <button class="wk-btn ph3" data-wk="31">Wk 31</button>
  <button class="wk-btn ph3 deload" data-wk="32">Wk 32</button>
  <button class="wk-btn ph3 attempt" data-wk="33">Wk 33 ★</button>
</div>

<main>
  <div class="wk-header glass-strong">
    <div>
      <div class="wk-title" id="wkTitle">Week 1</div>
      <div class="wk-dates" id="wkDates"></div>
    </div>
    <span class="wk-badge" id="wkBadge">Phase 0 — Hypertrophy Reset</span>
  </div>

  <div class="prog-strip">
    <div class="pc glass"><div class="pc-label">Incline Press</div><div class="pc-val" id="pv-i">—</div><div class="pc-sr" id="ps-i"></div></div>
    <div class="pc glass"><div class="pc-label">Overhead Press</div><div class="pc-val" id="pv-o">—</div><div class="pc-sr" id="ps-o"></div></div>
    <div class="pc glass"><div class="pc-label">Deadlift</div><div class="pc-val" id="pv-d">—</div><div class="pc-sr" id="ps-d"></div></div>
    <div class="pc glass"><div class="pc-label">Weighted Pull-up</div><div class="pc-val" id="pv-p">—</div><div class="pc-sr" id="ps-p"></div></div>
  </div>

  <div class="day-grid" id="dayGrid"></div>
</main>

const phNotes = {
  0:'Hypertrophy reset: rebuild incline volume at sub-max loads with paused reps to break the stall. Deadlift and OHP continue progressing normally.',
  1:'Strength phase: transition to heavier loads, lower reps. Incline should feel controlled and re-established. Deficit deadlifts added at week 13.',
  2:'Advanced strength: deadlift holds at 500 lb as a working weight. Press and pull-up targets push toward elite numbers.',
  3:'Peaking: volume drops sharply each week. Singles and doubles only. Body is being primed for the max attempt at week 33.',
};

const fmtDate = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const dayDate = (wk,off) => { const d=new Date(START); d.setDate(d.getDate()+(wk-1)*7+off); return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); };
const wkDates = wk => { const m=new Date(START); m.setDate(m.getDate()+(wk-1)*7); const s=new Date(m); s.setDate(s.getDate()+6); return `${fmtDate(m)} – ${fmtDate(s)}, ${s.getFullYear()}`; };

function iLb(w){ return w.i+' lb'; }
function oLb(w){ return w.o+' lb'; }
function dDisp(w){ return w.t==='attempt' ? '500 lb' : (w.d==='M' ? '—' : w.d+' lb'); }

function buildRow(name,sets,weight,rest,isPri){
  return `<div class="ex-row">
    <div class="ex-dot${isPri?' p':''}"></div>
    <div class="ex-left">
      <div class="ex-name${isPri?' p':''}">${name}</div>
      <div class="ex-sets">${sets}</div>
    </div>
    <div class="ex-right">
      <span class="ex-w">${weight}</span>
      <span class="ex-rest">${rest}</span>
    </div>
  </div>`;
}

function buildDays(wk){
  const w=WK[wk], p2=w.ph>=2;
  const isHyp=w.ph===0;
  const isPeak=w.t==='peak'||w.t==='attempt';
  const days=[];

  // MON — Push
  const monRows=[];
  if(isPeak){
    monRows.push(
      buildRow('Barbell Incline Press',w.iR||'1–2×1–2',iLb(w),'4 min',true),
      buildRow('Overhead Press (strict BB)',w.oR||'1–2×1–2',oLb(w),'3.5 min',true),
      buildRow('Incline DB Press (maintenance)','2×8','65 lb DBs','90 sec'),
      buildRow('Rear Delt Fly (cable)','3×20','15 lb ea','60 sec'),
    );
  } else {
    monRows.push(
      buildRow('Barbell Incline Press (paused)',w.iR,iLb(w),'3 min',true),
      buildRow('Overhead Press (strict BB)',w.oR,oLb(w),'2.5 min',true),
    );
    if(isHyp) monRows.push(buildRow('Close-grip Incline Press (paused)','3×8',(parseInt(w.i)-20)+' lb','2 min'));
    monRows.push(
      buildRow('Incline DB Press','3×'+(isHyp?'12':'10'),'65 lb DBs','90 sec'),
      buildRow('Cable Lateral Raise','3×15','12 lb ea','60 sec'),
      buildRow('Rear Delt Fly (cable)','3×20',p2?'12.5 lb ea':'10 lb ea','60 sec'),
    );
  }
  days.push({n:'Monday',off:0,tp:'push',tl:'Push',swim:false,rows:monRows});

  // TUE — Swim Sprint
  days.push({n:'Tuesday',off:1,tp:'swim',tl:'Sprint',swim:true,rows:[
    buildRow('Warm-up','200m','Easy','—'),
    buildRow('I.M. Kick','4×50m','On 1:00',''),
    buildRow('Reverse I.M.','4×50m','On 1:30',''),
    buildRow('Distance per Stroke','200m','Easy','—'),
    buildRow('Breath Hold','50m','Medium','—'),
    buildRow('Main','10×25m','On :30','—'),
    buildRow('Main','10×50m','On 1:00','—'),
    buildRow('Main','6×75m','Until HR recovers','—'),
    buildRow('Main','5×50m','On 1:00→:40 descending','—'),
    buildRow('Main','10×25m','On :45, no board kick','—'),
    buildRow('Cooldown','400m','Easy','Backstroke / free'),
  ]});

  // WED — Pull
  const wedRows=[
    buildRow('Weighted Pull-up',w.pR,w.p,'3 min',true),
    buildRow('Lat Pulldown (wide grip)','3×10',p2?'155 lb':'140 lb','90 sec'),
    buildRow('Seated Cable Row','3×10',p2?'165 lb':'150 lb','90 sec'),
    buildRow('Face Pull (rope)','4×20','45 lb','60 sec'),
    buildRow('Rear Delt Fly (incline DB)','4×15','17 lb DBs','60 sec'),
    isHyp ? buildRow('Chest-supported Row','3×12','Light','60 sec') : buildRow('Dragon Flag','3×5','BW','60 sec'),
  ];
  days.push({n:'Wednesday',off:2,tp:'pull',tl:'Pull',swim:false,rows:wedRows});

  // THU — Swim Middle Distance
  days.push({n:'Thursday',off:3,tp:'swim',tl:'Middle Distance',swim:true,rows:[
    buildRow('Warm-up','2×150m','Easy','—'),
    buildRow('Kick','3×100m','Easy','—'),
    buildRow('Warm-up','6×50m','Easy','—'),
    buildRow('Main — reverse pyramid (×2)','300m','On 4:30','—'),
    buildRow('','250m','On 4:00','—'),
    buildRow('','200m','On 3:30','—'),
    buildRow('','150m','On 3:00','—'),
    buildRow('','200m','On 3:30','—'),
    buildRow('','250m','On 4:00','—'),
    buildRow('','300m','On 4:30','—'),
    buildRow('Cooldown','1100m','Easy','Backstroke / free'),
  ]});

  // FRI — Lower
  const friRows=[buildRow('Conventional Deadlift',w.dR||'1×1',dDisp(w),p2?'3 min':'3.5 min',true)];
  if(wk>=13) friRows.push(buildRow('Deficit Deadlift (2″ plates)','3×3','310 lb','2.5 min'));
  friRows.push(
    buildRow('Romanian Deadlift','3×8',p2?'195 lb':'185 lb','90 sec'),
    buildRow('Bulgarian Split Squat','4×10 ea',p2?'40 lb DBs':'30 lb DBs','90 sec'),
    buildRow('Leg Curl (machine)','3×12','Moderate','60 sec'),
    buildRow('Walking Lunges','4×15','BW+load','60 sec'),
    buildRow('Dragon Flag','3×5','BW','60 sec'),
  );
  days.push({n:'Friday',off:4,tp:'lower',tl:'Legs',swim:false,rows:friRows});

  // SAT — Swim Distance
  days.push({n:'Saturday',off:5,tp:'swim',tl:'Distance',swim:true,rows:[
    buildRow('Warm-up (50 kick, 50 swim)','10×100m','On 2:00','—'),
    buildRow('Main','5×500m','Anaerobic max','—'),
    buildRow('Recovery between sets','200m','Easy','Backstroke'),
    buildRow('Cooldown','150m','Easy','—'),
  ]});

  return days;
}

const typeClass={push:'dct-push',pull:'dct-pull',lower:'dct-lower',swim:'dct-swim'};
let showSwim = true;

function toggleSwim(btn){
  showSwim = !showSwim;
  btn.classList.toggle('on', showSwim);
  document.querySelectorAll('.swim-card').forEach(c=>{
    c.classList.toggle('swim-hidden', !showSwim);
  });
}

function renderWeek(wk){
  const w=WK[wk];
  document.getElementById('wkTitle').textContent='Week '+wk;
  document.getElementById('wkDates').textContent=wkDates(wk);

  const badge=document.getElementById('wkBadge');
  badge.textContent=w.lbl;
  badge.className='wk-badge';
  if(w.t==='deload')       badge.className+=' wb-deload';
  else if(w.t==='attempt') badge.className+=' wb-attempt';
  else if(w.t==='peak')    badge.className+=' wb-peak';
  else if(w.ph===0)        badge.className+=' wb-hyp';
  else if(w.ph===1)        badge.className+=' wb-normal';
  else if(w.ph===2)        badge.className+=' wb-str2';
  else                     badge.className+=' wb-peak';

  document.getElementById('pv-i').textContent=iLb(w);
  document.getElementById('ps-i').textContent=w.iR||'';
  document.getElementById('pv-o').textContent=oLb(w);
  document.getElementById('ps-o').textContent=w.oR||'';
  document.getElementById('pv-d').textContent=dDisp(w);
  document.getElementById('ps-d').textContent=w.dR||'';
  document.getElementById('pv-p').textContent=w.p;
  document.getElementById('ps-p').textContent=w.pR||'';

  const grid=document.getElementById('dayGrid');
  grid.innerHTML='';
  buildDays(wk).forEach(day=>{
    const card=document.createElement('div');
    const classes=['day-card','glass'];
    if(day.swim) classes.push('swim-card');
    if(day.swim && !showSwim) classes.push('swim-hidden');
    card.className=classes.join(' ');
    card.innerHTML=`
      <div class="dc-header">
        <div>
          <div class="dc-name">${day.n}</div>
          <div class="dc-date">${dayDate(wk,day.off)}</div>
        </div>
        <span class="dc-type ${typeClass[day.tp]}">${day.tl}</span>
      </div>
      <div class="ex-list">${day.rows.join('')}</div>`;
    grid.appendChild(card);
  });
}

function markWk(wk){
  document.querySelectorAll('.wk-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.wk)===wk);
  });
  // scroll active button into view
  const activeBtn=document.querySelector('.wk-btn.active');
  if(activeBtn) activeBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

document.querySelectorAll('.wk-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    curWk=parseInt(btn.dataset.wk);
    markWk(curWk);
    renderWeek(curWk);
  });
});

try {
  const elapsed=Math.floor((Date.now()-START.getTime())/(1000*60*60*24*7))+1;
  curWk=Math.max(1,Math.min(elapsed,Object.keys(WK).length));
} catch(e){}

markWk(curWk);
renderWeek(curWk);
</script>
